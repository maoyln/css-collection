<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>widhtDemo块级元素</title>
  <style>
    .box {
      background-color: lightblue;
    }
    .box1 {
      background-color: lightblue;
      position: absolute;
      top: 400px;
    }
    .box2 {
      background-color: lightblue;
      position: absolute;
      top: 500px;
    }
    .box3 {
      background-color: rgb(123, 112, 206);
    }
    .box4 {
      background-color: rgb(83, 189, 79);
    }
  </style>
</head>
<body>
  <div class="box">这是一个块级元素</div>
  <hr />
  <div class="box1">这是一个块级元素-绝对定位（position: absolute;）-1</div>
  <hr />
  <div class="box2">这是一个块级元素-绝对定位（position: absolute;）-2
    <hr />
  </div>
  <hr />
  <div class="box3">这是一个块级元素-3</div>
  <hr />
  <div class="box4">这是一个块级元素-4</div>
  <hr />
</body>
</html>
