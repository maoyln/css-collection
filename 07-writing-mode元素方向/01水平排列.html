<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>writing-mode: horizontal-tb;</title>
    <style>
        .horizontal-text {
            writing-mode: horizontal-tb;
            padding: 20px;
            font-size: 24px;
        }
    </style>
</head>

<!-- 
  writing-mode: horizontal-tb;
  含义：这是 writing-mode 的默认值。文本水平书写，块级元素从上到下堆叠。这是大多数西方语言（如英语、法语等）的常见书写模式。
-->

<body>
    <div class="horizontal-text">
        这是一段使用 writing-mode: horizontal-tb; 的横排文本。
    </div>
</body>

</html>
