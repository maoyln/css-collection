<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>writing-mode: vertical-lr;</title>
    <style>
      .vertical-lr-text {
        writing-mode: vertical-lr;
        padding: 20px;
        font-size: 24px;
      }
    </style>
  </head>

  <!-- 
    vertical-lr
    含义：文本垂直书写，从左向右排列，块级元素从左向右堆叠。在一些特殊的排版需求中可能会用到。 
-->

  <body>
    <div class="vertical-lr-text">
      这是一段使用 writing-mode: vertical-lr; 的竖排文本。
      含义：文本垂直书写，从左向右排列，块级元素从左向右堆叠。在一些特殊的排版需求中可能会用到。
    </div>
  </body>
</html>
