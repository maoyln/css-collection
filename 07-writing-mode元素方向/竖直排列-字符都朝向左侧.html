<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>writing-mode: sideways-lr;</title>
    <style>
        .sideways-lr-text {
            writing-mode: sideways-lr;
            padding: 20px;
            font-size: 24px;
        }
    </style>
</head>

<!-- 
  sideways-lr
  含义：文本垂直排列，所有字符都朝向左侧。块级元素的排列方向与 vertical-lr 类似。
-->

<body>
    <div class="sideways-lr-text">
        这是一段使用 writing-mode: sideways-lr; 的文本。
        sideways-lr:文本垂直排列，所有字符都朝向左侧。块级元素的排列方向与 vertical-lr 类似。
    </div>
</body>

</html>
