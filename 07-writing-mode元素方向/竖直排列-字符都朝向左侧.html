<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>writing-mode: sideways-lr;</title>
    <style>
        .sideways-lr-text {
            writing-mode: sideways-lr;
            padding: 20px;
            font-size: 24px;
        }
    </style>
</head>

<body>
    <div class="sideways-lr-text">
        这是一段使用 writing-mode: sideways-lr; 的文本。
    </div>
</body>

</html>
