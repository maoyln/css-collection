<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>writing-mode: vertical-rl;</title>
    <style>
        .vertical-text {
            writing-mode: vertical-rl;
            padding: 20px;
            font-size: 24px;
        }
    </style>
</head>


<!-- 
  writing-mode: vertical-rl; 详细解释
  writing-mode: vertical-rl; 是 writing-mode 属性的一个具体取值，它表示文本以垂直方向从右向左书写，同时块级元素也是垂直排列，从右向左堆叠。这种书写模式常用于传统的东亚语言排版，如中文竖排、日文竖排等。 
-->

<body>
    <div class="vertical-text">
        这是一段使用 writing-mode: vertical-rl; 的竖排文本。
    </div>
</body>

</html>
