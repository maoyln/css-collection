<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Animation Demo</title>
    <style>
      html,
      body {
        height: 100%;
      }

      body {
        background-color: #1d1d1d;
        font-family: "Asap", sans-serif;
        color: #989898;
        margin: 0 10px;
        font-size: 16px;
      }

      h1,
      h2,
      h3 {
        font-family: "Signika Negative", sans-serif;
        margin: 10px 0 10px 0;
        color: #f3f2ef;
      }

      h1 {
        font-size: 36px;
      }

      h2 {
        font-size: 30px;
      }

      h3 {
        font-size: 24px;
      }

      p {
        line-height: 22px;
        margin-bottom: 16px;
        width: 650px;
      }

      #demo {
        height: 100%;
        position: relative;
      }
      .box {
        width: 50px;
        height: 50px;
        position: relative;
        border-radius: 6px;
        margin-top: 4px;
        display: inline-block;
      }

      .green {
        background-color: #6fb936;
      }

      .orange {
        background-color: #f38630;
      }
      .grey {
        background-color: #989898;
      }
    </style>
  </head>
  <body>
    <div id="demo">
      <div class="box green"></div>
      <div class="box grey"></div>
      <div class="box orange"></div>
      <div class="box green"></div>
      <div class="box grey"></div>
      <div class="box orange"></div>
      <div class="box green"></div>
      <div class="box grey"></div>
      <div class="box orange"></div>
    </div>

    <!-- 引入GSAP库 -->
    <script src="gsap@3.12.2/dist/gsap.min.js"></script>

    <script>
      // 页面加载完成后执行动画
      document.addEventListener("DOMContentLoaded", function () {
        gsap.to(".box", {
          keyframes: [
            { duration: 1, x: 100 },
            { duration: 1, backgroundColor: "#f38630", delay: 0.5 },
            { duration: 1, x: 0, rotation: -360, delay: 0.5 },
          ],
        });
      });
    </script>
  </body>
</html>
