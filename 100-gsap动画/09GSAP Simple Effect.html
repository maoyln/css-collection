<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Animation Demo</title>
    <link rel="stylesheet" href="./css/JGaKdQ.css" />

    <style>
      body {
        margin-top: 50px;
        text-align: center;
      }

      .box {
        display: inline-block;
        margin-right: 5px;
      }

      .pink {
        background-color: pink;
      }
    </style>
  </head>
  <!-- 学习：https://blog.csdn.net/m0_60157874/article/details/132146821 -->
  <body>
    <div class="box green"></div>
    <div class="box orange"></div>
    <div class="box grey"></div>

    <!-- 引入GSAP库 -->
    <script src="./s.cdpn.io/16327/gsap-latest-beta.min.js"></script>

    <script>
      // 页面加载完成后执行动画
      document.addEventListener("DOMContentLoaded", function () {
        gsap.registerEffect({
          name: "fade",
          defaults: { duration: 2 }, //defaults get applied to the "config" object passed to the effect below
          effect: (targets, config) => {
            return gsap.to(targets, { duration: config.duration, opacity: 0 });
          },
        });

        // now we can use it like this:
        gsap.effects.fade(".green");

        // Wait a bit and override the defaults:
        gsap.delayedCall(3, () =>
          gsap.effects.fade(".orange", { duration: 1 })
        );

        document
          .querySelector(".grey")
          .addEventListener("mouseenter", (e) => gsap.effects.fade(e.target));
      });
    </script>
  </body>
</html>
