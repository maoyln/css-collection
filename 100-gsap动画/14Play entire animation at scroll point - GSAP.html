<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Animation Demo</title>
    <style>
      @import url('https://fonts.googleapis.com/css?family=Signika+Negative:300,400&display=swap');
      body { 
        font-family: "Signika Negative", sans-serif; 
        font-weight: 300;
        text-align: center;
        height: 150vh;
      }
      h1 {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <!-- 学习：https://blog.csdn.net/m0_60157874/article/details/132146821 -->
  <body>
    <h2>Scroll down</h2>
    <h1>I'm revealed on scroll!</h1>
    

    <!-- 引入GSAP库 -->
    <script src="./s.cdpn.io/16327/gsap-latest-beta.min.js"></script>
    <script src="./s.cdpn.io/16327/DrawSVGPlugin3.min.js"></script>
    <!-- <script src="gsap@3.12.2/dist/gsap.min.js"></script> -->

    <script>
      // 页面加载完成后执行动画
      document.addEventListener("DOMContentLoaded", function () {
        const tl = gsap.timeline({paused: true});
        tl.from("h1", {scale: 0.7, autoAlpha: 0, duration: 1});

        function animateAtScrollPos() {
          if(scrollY > 100) {
            tl.play();
            document.removeEventListener("scroll", animateAtScrollPos);
          }
        }
        document.addEventListener("scroll", animateAtScrollPos);

      });
    </script>
  </body>
</html>
