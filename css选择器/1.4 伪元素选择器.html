<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1.4 伪元素选择器</title>
  <style>
    /* ::before	在元素前添加内容	p::before { content: "🔥"; } */
    p::before { content: "🔥"; }

    /* ::after	在元素后添加内容	p::after { content: "✨"; } */
    p::after { content: "✨"; }

    /* ::first-letter	选中第一个字母	p::first-letter { font-size: 2em; } */
    p::first-letter { font-size: 6em; }
    p::first-line { font-size: 1em; }

  </style>
</head>
<body>
  <div>
    <p>
      <div>
        ::before	在元素前添加内容
      </div>
    </p>
    <p>::before	在元素前添加内容</p>
  </div>
</body>
</html>
