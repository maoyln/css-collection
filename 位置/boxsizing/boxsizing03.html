<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box-Sizing Comparison</title>
  <style>
    .box-content, .box-border {
      margin-bottom: 20px;
      padding: 20px;
      border: 5px solid black;
    }

    .box-content {
      width: 200px;
      height: 100px;
      box-sizing: content-box;
      background-color: lightblue;
    }

    .box-border {
      width: 200px;
      height: 100px;
      box-sizing: border-box;
      background-color: lightcoral;
    }

    .box-content span, .box-border span {
      display: block;
      padding: 5px;
      background-color: lightgreen;
    }
  </style>
</head>
<body>

  <div class="box-content">
    <span>Content Box (content-box)</span>
  </div>

  <div class="box-border">
    <span>Border Box (border-box)</span>
  </div>

</body>
</html>
