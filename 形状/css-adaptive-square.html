<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自适应正方形</title>
</head>
<style>
  /* .container {
    display: flex;
  } */

  /* 使用vw */
  .square1 {
    width: 10%;
    height: 10vw;
    background: tomato;
  }

  /* 利用元素的margin/padding百分比是相对父元素width的性质来实现 */
  .square2 {
    width: 20%;
    height: 0;
    padding-top: 20%;
    background: orange;
  }

  /* 利用子元素的margin-top的值来实现： */
  .square3 {
    width: 30%;
    overflow: hidden;
    background: yellow;
  }
  .square3::after {
    content: '';
    display: block;
    margin-top: 100%;
    /* margin-top: 100%;：这是实现正方形效果的关键。margin-top 属性设置为百分比值时，这个百分比是相对于其父元素的宽度来计算的。
     * 在这里，由于 .square3 的宽度被设置为其父元素宽度的 30%，所以 .square3::after 的 margin-top 会根据 .square3 的宽度来计算，并且值为 .square3 宽度的 100%。
     * 这就使得 .square3::after 在垂直方向上撑开的高度与 .square3 的宽度相等，从而使整个 .square3 元素呈现出正方形的形状。
     */
  }
</style>
<body>
  <div class="container">
    <!-- 使用vw -->
    <div class="square1"></div>
    <hr/>

    <!-- 利用元素的margin -->
    <div class="square2"></div>
    <hr/>

    <!-- 利用子元素的margin-top的值来实现： -->
    <div class="square3"></div>
    <hr/>
  </div>
  
</body>
</html>
